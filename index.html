<!-- 
 HTML:
-Hyper Text Markup Language
-HTML is the code that is used to structure a web page and its content.
-The component used to design the
structure of websites are called HTML tags.

First HTML File:
-index.html
-It is the default name for a website's homepage

HTML Tag:
-A container for some content or other HTML tags
-<p> This is a paragraph</p>
     |-----Content-----|
|----------Element/Tag----------|

Quick Points:
-Html tag is parent of head & body tag
-Most of html elements have opening & closing tags with content in between
-Some tags have no content in between, eg - <br>
-We can use inspect element/view page source to edit html 

Comments in HTML:
-This is part of code that should not be parsed.

HTML is NOT case sensitive:
<p> = <P>
<html> = <HTML>
<head> = <HEAD>
<body> = <BODY> 

Basic HTML Tags:
- Attributes are used to add more information to the tag HTML Attributes
<html lang="en">

Basic HTML Page: -->

<!DOCTYPE html>                                     <!--tells browser you are using HTML5 -->
<html lang="en">                                    <!--root of an html document -->

<head>                                              <!--container for metadata -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My First Page</title>                        <!--page title -->

</head>

<body>                                              <!--contains all data rendered by the browser -->

<p><h1><b><i><u><big>Hello World</big></u></i></b></h1></p>       <!--paragraph tag -->

<br>                                                <!--line break tag -->

<big>This is big text</big><br>                     <!--big tag (used to make text bigger) -->
<small>This is small text</small><br>               <!--small tag (used to make text smaller) -->  

<small>

<h1>This is a heading</h1>                          <!--heading tag (most important)-->
<h2>This is a heading 2</h2>                        <!--heading 2 tag -->
<h3>This is a heading 3</h3>                        <!--heading 3 tag -->
<h4>This is a heading 4</h4>                        <!--heading 4 tag -->
<h5>This is a heading 5</h5>                        <!--heading 5 tag -->
<h6>This is a heading 6</h6>                        <!--heading 6 tag (least important) -->

</small>

<hr>                                                <!--horizontal rule tag (used to create a horizontal line) -->
<a href="https://google.com"> Google </a>           <!--anchor tag (used for links) -->
<hr>

<br><br>  

<img src="pooh.jpg" alt="Random Image">             <!--image tag (used to display images) -->


<br><br>     

<a href="https://google.com"><img src="google.png" alt="Random Image"></a>  <!--anchor tag with image inside (used for links) -->                                            
<br><br>
 
<hr>

<!-- These are subscript and superscript tags and they are used to display text in subscript and superscript format respectively. -->

<sub> subscript </sub><br>                    
<sup> superscript </sup><br>    

<sup>H<sub>2</sub>O</sup><br>

<sub>A<sup>n</sup></sub><br><br>

<!-- Pre Tag: Used to display text as it is (without ignoring spaces & next line) -->

<pre> This
is a sample
text.
</pre><br>

</body>

</html>
